<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>AiWay</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <strong>المحادثات</strong>
      <button class="icon mobile-only" id="closeSide" aria-label="إغلاق">✕</button>
    </div>
    <button class="new-chat" id="newChat">＋ محادثة جديدة</button>
    <input class="search" id="historySearch" placeholder="بحث في المحادثات">
    <div class="history" id="history"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="brand">
        <button class="icon mobile-only" id="menuBtn" aria-label="فتح المحادثات">☰</button>
        <div class="logo">AI</div>
        <div class="brand-copy"><b>AiWay</b><small>مساعد متعدد النماذج</small></div>
      </div>

      <div class="model-picker-wrap">
        <label for="modelSelect">النموذج</label>
        <select id="modelSelect" class="model-select" aria-label="اختيار النموذج">
          <option value="~openai/gpt-latest" data-label="ChatGPT — أحدث إصدار">ChatGPT — أحدث إصدار</option>
          <option value="~anthropic/claude-opus-latest" data-label="Claude — أحدث إصدار">Claude — أحدث إصدار</option>
          <option value="~google/gemini-pro-latest" data-label="Gemini — أحدث إصدار">Gemini — أحدث إصدار</option>
        </select>
      </div>

      <div class="top-actions">
        <button class="icon" id="themeBtn" title="الوضع الليلي" aria-label="الوضع الليلي">◐</button>
        <button class="icon" id="settingsBtn" title="الإعدادات" aria-label="الإعدادات">⚙</button>
      </div>
    </header>

    <section class="chat" id="chat" aria-live="polite"></section>

    <button class="jump-bottom" id="jumpBottom" aria-label="النزول لآخر المحادثة" title="النزول لآخر المحادثة">↓</button>

    <section class="composer-area">
      <div class="preview" id="preview"></div>
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
        <div class="composer-actions">
          <div class="composer-tools">
            <button class="tool" id="fileBtn" aria-label="إرفاق ملفات">📎 <span>ملفات</span></button>
            <button class="tool" id="cameraBtn" aria-label="فتح الكاميرا">📷 <span>كاميرا</span></button>
            <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,text/csv" multiple hidden>
            <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
          </div>
          <button class="send" id="sendBtn">إرسال ↑</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="overlay" id="overlay"></div>

<section class="modal" id="settingsModal">
  <h3>الإعدادات</h3>
  <label for="memoryInput">ذاكرة المساعد</label>
  <textarea id="memoryInput" class="field" rows="6" placeholder="مثال: اسمي أحمد وأفضل الإجابات المختصرة."></textarea>
  <p>مفتاح OpenRouter محفوظ داخل متغيرات بيئة Vercel فقط.</p>
  <div class="modal-actions">
    <button class="secondary closeModal">إغلاق</button>
    <button class="primary" id="saveSettings">حفظ</button>
  </div>
</section>

<div id="toast" class="toast"></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
