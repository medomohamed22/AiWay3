<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pi Market</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <style>
    :root{--p:#002f34;--p2:#00474f;--a:#ffce32;--bg:#f4f7f7;--line:#d8e0e1;--muted:#6c797c;--danger:#b3261e}
    *{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#173438}
    button,input,select,textarea{font:inherit}.container{width:min(1180px,calc(100% - 26px));margin:auto}
    header{position:sticky;top:0;z-index:30;background:var(--p);color:#fff;box-shadow:0 5px 18px #0002}
    .nav{min-height:72px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:22px;font-weight:900;display:flex;align-items:center;gap:9px}
    .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--a);color:var(--p);font-size:26px}
    .search{flex:1;display:flex;gap:8px}.search input,.search select{border:0;border-radius:10px;padding:12px;min-width:0}.search input{flex:1}
    button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.yellow{background:var(--a);color:var(--p)}
    .outline{background:transparent;color:#fff;border:1px solid #ffffff66}.user{display:none;align-items:center;gap:8px}
    .user.show{display:flex}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--a);color:var(--p);font-weight:900}
    .hero{padding:55px 0;background:linear-gradient(135deg,#00474f,#002f34);color:#fff}.hero h1{font-size:clamp(34px,6vw,64px);margin:0 0 12px}.hero p{max-width:720px;line-height:1.9;color:#dce8e9}
    section{padding:32px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h2{margin:0}
    .cats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.cat{background:#fff;border:1px solid var(--line);padding:18px 8px}.cat.active{border-color:var(--p);box-shadow:0 8px 25px #002f3414}
    .cat span{display:block;font-size:28px;margin-bottom:6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}
    .card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 7px 22px #002f340d}.card img{width:100%;height:190px;object-fit:cover;background:#e5ebeb}
    .body{padding:14px}.price{font-size:21px;font-weight:900;color:var(--p)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
    .modal{display:none;position:fixed;inset:0;background:#001b1dcc;z-index:80;padding:15px;align-items:center;justify-content:center}.modal.show{display:flex}
    .box{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.mh{display:flex;justify-content:space-between;align-items:center}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}
    .field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:12px}.field textarea{min-height:100px}.primary{background:var(--p);color:#fff}
    .chat-layout{display:grid;grid-template-columns:210px 1fr;gap:12px}.convos{border-left:1px solid var(--line);max-height:470px;overflow:auto}
    .convo{width:100%;text-align:right;background:#fff;border-bottom:1px solid var(--line);border-radius:0}.convo.active{background:#e9f2f2}
    .messages{height:380px;overflow:auto;background:#f6f8f8;padding:12px;border-radius:12px}.bubble{max-width:80%;background:#fff;padding:9px 12px;border-radius:12px;margin:8px 0}
    .bubble.mine{margin-right:auto;background:#d9f4eb}.send{display:flex;gap:8px;margin-top:10px}.send input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px}
    .empty{text-align:center;padding:35px;background:#fff;border-radius:15px;color:var(--muted)}.error{color:var(--danger)}
    @media(max-width:900px){.cats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.search{order:3;width:100%}}
    @media(max-width:600px){.cats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.chat-layout{grid-template-columns:1fr}.convos{border:0;max-height:130px}}
  </style>
</head>
<body>
<header>
  <div class="container nav">
    <div class="brand"><span class="logo">π</span> Pi Market</div>
    <div class="search"><input id="q" placeholder="ابحث في الإعلانات"><select id="city"><option value="">كل المدن</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option></select><button class="yellow" id="search">بحث</button></div>
    <div class="user" id="userBox"><span class="avatar" id="avatar">P</span><strong id="piName"></strong></div>
    <button class="outline" id="loginBtn">دخول بحساب Pi</button>
    <button class="yellow" id="chatBtn">المحادثات</button>
    <button class="yellow" id="addBtn">+ إعلان</button>
  </div>
</header>

<div class="hero"><div class="container"><h1>سوق Pi للإعلانات</h1><p>بيع واشترِ وتواصل مع البائعين. المستخدمون والإعلانات والمحادثات محفوظة في Supabase مع سياسات حماية RLS.</p></div></div>

<section><div class="container"><div class="head"><h2>الأقسام</h2></div><div class="cats" id="cats"></div></div></section>
<section><div class="container"><div class="head"><h2>أحدث الإعلانات</h2><select id="sort"><option value="new">الأحدث</option><option value="low">الأقل سعرًا</option><option value="high">الأعلى سعرًا</option></select></div><div class="grid" id="ads"></div></div></section>

<div class="modal" id="adModal"><div class="box"><div class="mh"><h2>إضافة إعلان</h2><button data-close="adModal">✕</button></div>
<form class="form" id="adForm">
<div class="field full"><label>العنوان</label><input id="title" required></div>
<div class="field"><label>القسم</label><select id="category" required></select></div>
<div class="field"><label>المدينة</label><select id="adCity" required><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option></select></div>
<div class="field"><label>السعر بالـ Pi</label><input id="price" type="number" step=".01" min="0" required></div>
<div class="field"><label>رابط الصورة</label><input id="image" type="url"></div>
<div class="field full"><label>الوصف</label><textarea id="description" required></textarea></div>
<button class="primary full">نشر الإعلان</button></form></div></div>

<div class="modal" id="detailsModal"><div class="box"><div class="mh"><h2 id="dTitle"></h2><button data-close="detailsModal">✕</button></div>
<img id="dImage" style="width:100%;height:280px;object-fit:cover;border-radius:14px"><h2 id="dPrice"></h2><p id="dDesc"></p><p id="dMeta"></p>
<button class="primary" id="contactBtn" style="width:100%">بدء محادثة مع البائع</button></div></div>

<div class="modal" id="chatModal"><div class="box" style="width:min(850px,100%)"><div class="mh"><h2>المحادثات</h2><button data-close="chatModal">✕</button></div>
<div class="chat-layout"><div class="convos" id="convos"></div><div><div class="messages" id="messages"><div class="empty">اختر محادثة</div></div>
<form class="send" id="sendForm"><input id="messageInput" placeholder="اكتب رسالة..." required><button class="primary">إرسال</button></form></div></div></div></div>

<script>
const SUPABASE_URL = "https://lptfaygmbuzuinhzsyvu.supabase.co/rest/v1/";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_6lED9FXDvjKDH2z6ytu_gA_s4JwY_vp";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

Pi.init({version:"2.0",sandbox:false});

const categories=[["الكل","🧭"],["سيارات","🚗"],["عقارات","🏠"],["موبايلات","📱"],["إلكترونيات","💻"],["أثاث","🛋️"],["وظائف","💼"],["خدمات","🛠️"],["أخرى","📦"]];
let profile=null, ads=[], currentCategory="الكل", selectedAd=null, activeConversation=null, channel=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function modal(id,show=true){$(id).classList.toggle("show",show)}
function renderUser(){
  const ok=!!profile;
  $("userBox").classList.toggle("show",ok);
  $("loginBtn").style.display=ok?"none":"inline-block";
  if(ok){$("piName").textContent=profile.pi_username;$("avatar").textContent=(profile.pi_username||"P")[0].toUpperCase()}
}
async function ensureSupabaseSession(){
  const {data:{session}}=await db.auth.getSession();
  if(session) return session;
  const {data,error}=await db.auth.signInAnonymously();
  if(error) throw error;
  return data.session;
}
async function loginPi(){
  $("loginBtn").disabled=true;
  try{
    await ensureSupabaseSession();
    const auth=await Pi.authenticate(["username"],p=>console.warn("Incomplete payment",p));
    const {data,error}=await db.functions.invoke("verify-pi",{body:{piAccessToken:auth.accessToken}});
    if(error) throw error;
    profile=data.profile;
    renderUser();
    await loadAds();
  }catch(e){console.error(e);alert("فشل تسجيل الدخول. افتح الموقع داخل Pi Browser، وفعّل Anonymous Sign-ins في Supabase، وانشر Edge Function verify-pi.")}
  finally{$("loginBtn").disabled=false}
}
async function restoreProfile(){
  const {data:{session}}=await db.auth.getSession();
  if(!session)return;
  const {data}=await db.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  profile=data;renderUser();
}
function renderCategories(){
  $("cats").innerHTML=categories.map(([n,i])=>`<button class="cat ${n===currentCategory?"active":""}" data-cat="${n}"><span>${i}</span>${n}</button>`).join("");
  $("category").innerHTML=categories.slice(1).map(([n])=>`<option>${n}</option>`).join("");
}
async function loadAds(){
  let query=db.from("ads").select("*,profiles!ads_owner_id_fkey(pi_username)").eq("status","active");
  if(currentCategory!=="الكل")query=query.eq("category",currentCategory);
  if($("city").value)query=query.eq("city",$("city").value);
  if($("q").value.trim())query=query.ilike("title",`%${$("q").value.trim()}%`);
  query=query.order($("sort").value==="low"?"price":$("sort").value==="high"?"price":"created_at",{ascending:$("sort").value==="low"});
  const {data,error}=await query;
  if(error){$("ads").innerHTML=`<div class="empty error">${esc(error.message)}</div>`;return}
  ads=data||[];renderAds();
}
function renderAds(){
  $("ads").innerHTML=ads.length?ads.map(a=>`<article class="card"><img src="${esc(a.image_url||"https://placehold.co/800x550?text=Pi+Market")}" onerror="this.src='https://placehold.co/800x550?text=Pi+Market'"><div class="body"><div class="price">${Number(a.price).toLocaleString("ar-EG")} π</div><h3>${esc(a.title)}</h3><div class="meta"><span>${esc(a.city)}</span><span>${esc(a.category)}</span></div><button class="primary" style="width:100%;margin-top:12px" data-details="${a.id}">التفاصيل</button></div></article>`).join(""):`<div class="empty">لا توجد إعلانات</div>`;
}
async function addAd(e){
  e.preventDefault();if(!profile)return alert("سجل الدخول أولًا");
  const row={owner_id:profile.id,title:$("title").value.trim(),description:$("description").value.trim(),category:$("category").value,city:$("adCity").value,price:Number($("price").value),image_url:$("image").value.trim()||null};
  const {error}=await db.from("ads").insert(row);if(error)return alert(error.message);
  e.target.reset();modal("adModal",false);await loadAds();
}
function showDetails(id){
  selectedAd=ads.find(a=>a.id===id);if(!selectedAd)return;
  $("dTitle").textContent=selectedAd.title;$("dPrice").textContent=`${Number(selectedAd.price).toLocaleString("ar-EG")} π`;
  $("dDesc").textContent=selectedAd.description;$("dMeta").textContent=`${selectedAd.city} • البائع: ${selectedAd.profiles?.pi_username||"مستخدم Pi"}`;
  $("dImage").src=selectedAd.image_url||"https://placehold.co/800x550?text=Pi+Market";modal("detailsModal");
}
async function startConversation(){
  if(!profile)return loginPi();
  if(selectedAd.owner_id===profile.id)return alert("هذا إعلانك");
  const {data,error}=await db.rpc("get_or_create_conversation",{p_ad_id:selectedAd.id,p_seller_id:selectedAd.owner_id});
  if(error)return alert(error.message);
  modal("detailsModal",false);modal("chatModal");await loadConversations(data);
}
async function loadConversations(selectId=null){
  if(!profile)return;
  const {data,error}=await db.from("conversation_members").select("conversation_id,conversations(id,ad_id,updated_at,ads(title))").eq("user_id",profile.id).order("joined_at",{ascending:false});
  if(error)return;
  const rows=data||[];
  $("convos").innerHTML=rows.length?rows.map(r=>`<button class="convo ${r.conversation_id===(selectId||activeConversation)?"active":""}" data-convo="${r.conversation_id}">${esc(r.conversations.ads?.title||"محادثة")}</button>`).join(""):`<div class="empty">لا توجد محادثات</div>`;
  if(selectId)await openConversation(selectId);
}
async function openConversation(id){
  activeConversation=id;await loadConversations();
  const {data,error}=await db.from("messages").select("*,profiles(pi_username)").eq("conversation_id",id).order("created_at");
  if(error)return;
  renderMessages(data||[]);
  if(channel)await db.removeChannel(channel);
  channel=db.channel("messages-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`conversation_id=eq.${id}`},async payload=>{
    const {data}=await db.from("messages").select("*,profiles(pi_username)").eq("id",payload.new.id).single();
    appendMessage(data);
  }).subscribe();
}
function renderMessages(rows){$("messages").innerHTML="";rows.forEach(appendMessage)}
function appendMessage(m){
  const div=document.createElement("div");div.className="bubble "+(m.sender_id===profile.id?"mine":"");
  div.innerHTML=`<strong>${esc(m.profiles?.pi_username||"مستخدم")}</strong><br>${esc(m.body)}`;$("messages").appendChild(div);$("messages").scrollTop=$("messages").scrollHeight;
}
async function sendMessage(e){
  e.preventDefault();if(!activeConversation)return alert("اختر محادثة");
  const body=$("messageInput").value.trim();if(!body)return;
  const {error}=await db.from("messages").insert({conversation_id:activeConversation,sender_id:profile.id,body});
  if(error)return alert(error.message);$("messageInput").value="";
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-cat]"),d=e.target.closest("[data-details]"),x=e.target.closest("[data-close]"),v=e.target.closest("[data-convo]");
  if(c){currentCategory=c.dataset.cat;renderCategories();loadAds()} if(d)showDetails(d.dataset.details);if(x)modal(x.dataset.close,false);if(v)openConversation(v.dataset.convo);
  if(e.target.classList.contains("modal"))modal(e.target.id,false);
});
$("loginBtn").onclick=loginPi;$("addBtn").onclick=()=>profile?modal("adModal"):loginPi;$("chatBtn").onclick=async()=>{if(!profile)return loginPi();modal("chatModal");await loadConversations()};
$("contactBtn").onclick=startConversation;$("adForm").onsubmit=addAd;$("sendForm").onsubmit=sendMessage;
$("search").onclick=loadAds;$("q").oninput=loadAds;$("city").onchange=loadAds;$("sort").onchange=loadAds;
renderCategories();restoreProfile().then(loadAds);
</script>
</body></html>
