<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6366F1">
<title>DealWay</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script defer src="https://sdk.minepi.com/pi-sdk.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<style>
:root{--primary:#6366F1;--primary-dark:#4F46E5;--accent:#F59E0B;--bg:#F8FAFC;--surface:#fff;--text:#0F172A;--muted:#64748B;--light:#94A3B8;--danger:#EF4444;--success:#10B981;--border:#E2E8F0;--shadow:0 10px 30px rgb(15 23 42/.08);--shadow-lg:0 20px 45px rgb(15 23 42/.15);--r:16px;--rx:24px;--nav:78px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{font-family:Tajawal,sans-serif;background:linear-gradient(135deg,#F8FAFC,#F1F5F9);color:var(--text);padding-bottom:calc(var(--nav) + 22px);min-height:100vh}.hidden{display:none!important}
button,input,select,textarea{font:inherit}.container{width:min(100%,920px);margin:auto;padding:16px}
.header{position:sticky;top:0;z-index:50;height:70px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;background:#ffffffdf;backdrop-filter:blur(18px);border-bottom:1px solid #e2e8f099;box-shadow:0 6px 24px rgb(15 23 42/.05)}
.brand{font-size:28px;font-weight:900;letter-spacing:-1px}.brand .deal{color:#8B5CF6}.brand .way{color:#F59E0B}.header-actions{display:flex;align-items:center;gap:10px}.header-user{display:flex;align-items:center;gap:9px;padding:7px 13px;border-radius:999px;background:linear-gradient(135deg,#6366f11a,#f59e0b1a);border:1px solid #6366f133}.status-dot{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px #10b9811f}.header-name{font-size:14px;font-weight:800}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.25s}.btn:active{transform:scale(.97)}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;box-shadow:0 8px 22px #6366f14d}.btn-gold{background:linear-gradient(135deg,var(--accent),#D97706);color:#fff;box-shadow:0 8px 22px #f59e0b42}.btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--border)}.btn-danger{background:linear-gradient(135deg,var(--danger),#DC2626);color:#fff}.btn[disabled]{opacity:.6;pointer-events:none}
.search-row{display:grid;grid-template-columns:1fr 170px;gap:12px;margin:8px 0 16px}.search-wrap{position:relative}.search-wrap i{position:absolute;right:17px;top:50%;transform:translateY(-50%);color:var(--light)}.search-input,.select,.input{width:100%;border:2px solid var(--border);background:#fff;border-radius:18px;padding:14px 44px 14px 16px;outline:0;transition:.2s}.select,.input{padding:14px}.search-input:focus,.select:focus,.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #6366f11a}
.categories{position:sticky;top:70px;z-index:35;background:#f8fafce8;backdrop-filter:blur(12px);padding:12px 0;margin-bottom:18px}.categories-scroll{display:flex;gap:10px;overflow:auto;scrollbar-width:none}.categories-scroll::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:2px solid var(--border);background:#fff;border-radius:999px;padding:10px 16px;font-weight:800;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px}.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:var(--primary);box-shadow:0 8px 20px #6366f13d}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.section-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px #6366f13d}.section-head h2{font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 4px 15px rgb(15 23 42/.05);cursor:pointer;transition:.25s}.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.card-img-wrap{position:relative;aspect-ratio:1/1;background:#eef2f7}.card-img{width:100%;height:100%;object-fit:cover}.location{position:absolute;bottom:8px;left:8px;max-width:85%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#0f172ad9;color:#fff;padding:5px 8px;border-radius:8px;font-size:10px}.card-body{padding:13px;text-align:center}.card-title{font-size:14px;font-weight:900;line-height:1.45;min-height:41px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:6px 13px;border-radius:999px;background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E;border:1px solid #FCD34D;font-weight:900;font-size:13px}
.view{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.empty{text-align:center;padding:55px 20px;color:var(--muted);grid-column:1/-1}.empty i{font-size:56px;color:#cbd5e1;margin-bottom:16px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);z-index:100;background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid #e2e8f099;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -10px 35px rgb(15 23 42/.08)}.nav-item{position:relative;width:86px;border:0;background:none;color:var(--muted);font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px;border-radius:15px;cursor:pointer}.nav-item i{font-size:20px}.nav-item.active{color:var(--primary);background:#6366f112}.badge{position:absolute;top:3px;right:19px;background:var(--danger);color:#fff;border:2px solid #fff;min-width:20px;height:20px;border-radius:999px;font-size:10px;display:grid;place-items:center}
.modal{position:fixed;inset:0;z-index:2000;background:#0f172a99;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}.modal.show{display:flex}.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:24px;box-shadow:0 -25px 70px #0003}.modal-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--border);margin-bottom:18px}.modal-title{font-size:21px;font-weight:900;display:flex;align-items:center;gap:10px}.close{width:40px;height:40px;border-radius:50%;border:0;background:#f1f5f9;color:var(--muted);cursor:pointer}
.form-group{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.form-label{font-size:14px;font-weight:800}.form-label i{color:var(--primary);margin-left:6px}.textarea{min-height:105px;resize:vertical}.upload-box{border:3px dashed var(--border);border-radius:22px;padding:30px 18px;text-align:center;background:linear-gradient(135deg,#F8FAFC,#F1F5F9);cursor:pointer}.upload-box:hover{border-color:var(--primary)}.upload-box i{font-size:43px;color:var(--primary);margin-bottom:10px}.upload-title{font-weight:900}.upload-note{font-size:12px;color:var(--light);margin-top:5px}.previews{display:flex;gap:10px;overflow:auto;margin:12px 0}.preview{width:88px;height:88px;border-radius:14px;overflow:hidden;position:relative;flex:none;border:2px solid var(--border)}.preview img{width:100%;height:100%;object-fit:cover}.preview button{position:absolute;top:4px;right:4px;width:25px;height:25px;border-radius:50%;border:2px solid #fff;background:var(--danger);color:#fff;cursor:pointer}
.slider{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:#eef2f7;margin-bottom:18px;box-shadow:var(--shadow)}.slider-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.slide{flex:0 0 100%;scroll-snap-align:center}.slide img{width:100%;height:100%;object-fit:contain}.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#0005;padding:7px 10px;border-radius:999px}.dot{width:8px;height:8px;border-radius:50%;background:#ffffff66}.dot.active{background:#fff;transform:scale(1.25)}.detail-card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:20px;margin-top:15px;box-shadow:0 4px 14px #0000000d}.seller{display:flex;align-items:center;gap:14px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:22px;font-weight:900}
.profile-head{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:25px;padding:35px 20px;text-align:center;color:#fff;box-shadow:var(--shadow-lg);margin-bottom:20px}.profile-avatar{width:92px;height:92px;border-radius:50%;background:#fff;color:var(--primary);display:grid;place-items:center;margin:auto auto 12px;font-size:36px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:17px;text-align:center}.stat strong{display:block;font-size:25px;color:var(--primary)}
.chat-list-item{background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}.chat-area{height:350px;overflow:auto;background:#f8fafc;border:1px solid var(--border);border-radius:17px;padding:12px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:11px 14px;border-radius:18px;background:#fff;border:1px solid var(--border)}.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:0}.send-row{display:flex;gap:9px;margin-top:10px}.send-row input{flex:1}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:5000;background:#fff;border:1px solid var(--border);border-right:4px solid var(--success);padding:14px 18px;border-radius:16px;box-shadow:var(--shadow-lg);display:none;max-width:90%}.toast.show{display:block}.toast.error{border-right-color:var(--danger)}
.progress{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:10px 0}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));transition:.2s}
.debug{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#0b1719;color:#d8f5e8;padding:14px;border-radius:14px;max-height:45vh;overflow:auto;font:12px/1.6 monospace}
@media(max-width:620px){.search-row{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.card-body{padding:11px}.stats{gap:8px}.stat{padding:13px 7px}.stat strong{font-size:21px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<header class="header">
  <div class="brand"><span class="deal">Deal</span><span class="way">Way</span></div>
  <div class="header-actions">
    <button id="loginBtn" class="btn btn-gold"><i class="fa-solid fa-fingerprint"></i> دخول</button>
    <div id="headerUser" class="header-user hidden"><span class="status-dot"></span><span id="userName" class="header-name"></span></div>
  </div>
</header>

<main class="container">
  <section id="view-home" class="view">
    <div class="search-row">
      <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" class="search-input" placeholder="ابحث عن منتج..."></div>
      <select id="cityFilter" class="select"><option value="">كل المدن</option><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option></select>
    </div>
    <div class="categories"><div id="categories" class="categories-scroll"></div></div>
    <div class="section-head"><div class="section-icon"><i class="fa-solid fa-fire"></i></div><h2>أحدث المعروضات</h2></div>
    <div id="products" class="grid"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><h3>جاري التحميل...</h3></div></div>
  </section>

  <section id="view-details" class="view hidden">
    <button class="btn btn-ghost" onclick="nav('home')" style="margin-bottom:15px"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
    <div class="slider"><div id="detailSlider" class="slider-track"></div><div id="detailDots" class="dots"></div></div>
    <h1 id="detailTitle" style="font-size:25px;margin-bottom:10px"></h1>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div id="detailPrice" class="price" style="font-size:18px"></div><div id="detailCity" class="chip"></div></div>
    <div class="detail-card"><h3 style="margin-bottom:10px"><i class="fa-solid fa-align-right" style="color:var(--primary)"></i> الوصف</h3><p id="detailDescription" style="color:var(--muted);white-space:pre-wrap;line-height:1.8"></p></div>
    <div class="detail-card seller"><div id="sellerAvatar" class="avatar">U</div><div><strong id="sellerName"></strong><div style="color:var(--muted);font-size:13px;margin-top:4px">بائع على DealWay</div></div></div>
    <div id="detailActions" style="margin-top:16px"></div>
  </section>

  <section id="view-chats" class="view hidden">
    <div class="section-head"><div class="section-icon" style="background:linear-gradient(135deg,#10B981,#059669)"><i class="fa-solid fa-comments"></i></div><h2>المحادثات</h2></div>
    <div id="inbox"></div>
  </section>

  <section id="view-profile" class="view hidden">
    <div id="guestProfile" class="empty"><i class="fa-solid fa-user-lock"></i><h2>أنت زائر</h2><p style="margin:8px 0 18px">سجل الدخول لإدارة إعلاناتك.</p><button class="btn btn-primary" onclick="loginPi()">دخول</button></div>
    <div id="userProfile" class="hidden">
      <div class="profile-head"><div class="profile-avatar"><i class="fa-solid fa-user"></i></div><h2 id="profileName"></h2><div style="margin-top:6px">Pioneer</div></div>
      <div class="stats"><div class="stat"><strong id="statAds">0</strong><span>إعلاناتي</span></div><div class="stat"><strong id="statImages">0</strong><span>الصور</span></div><div class="stat"><strong id="statChats">0</strong><span>المحادثات</span></div></div>
      <button class="btn btn-primary" style="width:100%;margin-bottom:20px" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> إضافة إعلان جديد</button>
      <div class="section-head"><div class="section-icon"><i class="fa-solid fa-layer-group"></i></div><h2>إعلاناتي</h2></div>
      <div id="myAds" class="grid"></div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-nav="home" onclick="nav('home')"><i class="fa-solid fa-house-chimney"></i><span>الرئيسية</span></button>
  <button class="nav-item" data-nav="chats" onclick="nav('chats')"><i class="fa-solid fa-comment-dots"></i><span>المحادثات</span><span id="chatBadge" class="badge hidden">0</span></button>
  <button class="nav-item" data-nav="profile" onclick="nav('profile')"><i class="fa-solid fa-user-gear"></i><span>حسابي</span></button>
</nav>

<div id="addModal" class="modal">
  <div class="sheet">
    <div class="modal-head"><div class="modal-title"><i class="fa-solid fa-camera" style="color:var(--primary)"></i> بيع منتج جديد</div><button class="close" onclick="closeModal('addModal')"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="previews" class="previews"></div>
    <label class="upload-box">
      <input id="imageInput" type="file" accept="image/*" multiple hidden>
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <div class="upload-title">اضغط لاختيار الصور</div>
      <div class="upload-note">حد أقصى 3 صور — يتم ضغطها تلقائيًا قبل الرفع</div>
    </label>
    <div id="uploadProgressWrap" class="hidden"><div class="progress"><div id="uploadProgress" class="progress-bar"></div></div><div id="uploadText" style="font-size:13px;color:var(--muted)"></div></div>
    <form id="adForm">
      <div class="form-group"><label class="form-label"><i class="fa-solid fa-tag"></i>اسم المنتج</label><input id="adTitle" class="input" required maxlength="100"></div>
      <div class="form-group"><label class="form-label"><i class="fa-solid fa-folder-open"></i>القسم</label><select id="adCategory" class="select" required></select></div>
      <div class="form-group"><label class="form-label"><i class="fa-solid fa-location-dot"></i>المدينة</label><select id="adCity" class="select" required><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option></select></div>
      <div class="form-group"><label class="form-label"><i class="fa-solid fa-coins"></i>السعر بالـ Pi</label><input id="adPrice" class="input" type="number" min="0" step=".01" required></div>
      <div class="form-group"><label class="form-label"><i class="fa-solid fa-align-left"></i>الوصف</label><textarea id="adDescription" class="input textarea" required maxlength="2000"></textarea></div>
      <button id="publishBtn" class="btn btn-primary" style="width:100%">نشر الإعلان</button>
    </form>
  </div>
</div>

<div id="chatModal" class="modal">
  <div class="sheet">
    <div class="modal-head"><div><div id="chatTitle" class="modal-title">محادثة</div><div id="chatPeer" style="font-size:13px;color:var(--muted)"></div></div><button class="close" onclick="closeChat()"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="messages" class="chat-area"></div>
    <form id="sendForm" class="send-row"><input id="messageInput" class="input" placeholder="اكتب رسالة..." required><button class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button></form>
  </div>
</div>

<div id="debugModal" class="modal"><div class="sheet"><div class="modal-head"><div class="modal-title">تفاصيل الخطأ</div><button class="close" onclick="closeModal('debugModal')">✕</button></div><pre id="debugOutput" class="debug"></pre><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="copyDebug()">نسخ الخطأ</button></div></div>

<script>
Pi.init({version:"2.0",sandbox:false});
const CATS=[["الكل","all","fa-layer-group"],["سيارات","سيارات","fa-car"],["عقارات","عقارات","fa-house"],["موبايلات","موبايلات","fa-mobile-screen"],["إلكترونيات","إلكترونيات","fa-laptop"],["أثاث","أثاث","fa-couch"],["وظائف","وظائف","fa-briefcase"],["خدمات","خدمات","fa-screwdriver-wrench"],["أخرى","أخرى","fa-box"]];
let db=null,profile=null,ads=[],activeCategory="all",selectedFiles=[],selectedAd=null,activeConversation=null,realtime=null,bootPromise=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function showToast(msg,type="success"){const t=$("toast");t.textContent=msg;t.className="toast show "+(type==="error"?"error":"");setTimeout(()=>t.className="toast",3000)}
function openModal(id){$(id).classList.add("show")}function closeModal(id){$(id).classList.remove("show")}
function showError(e,extra={}){$("debugOutput").textContent=JSON.stringify({time:new Date().toISOString(),message:e?.message||String(e),stack:e?.stack||null,...extra},null,2);openModal("debugModal")}
async function copyDebug(){await navigator.clipboard.writeText($("debugOutput").textContent);showToast("تم النسخ")}
async function boot(){
  try{
    const res=await fetch("/api/config",{cache:"no-store"}),text=await res.text();let cfg;
    try{cfg=JSON.parse(text)}catch{throw new Error("رد /api/config غير صالح: "+text.slice(0,500))}
    if(!res.ok)throw new Error(cfg.error||"فشل /api/config");
    db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
    await restoreProfile();renderCategories();await loadAds();
  }catch(e){showError(e,{stage:"boot"});throw e}
}
async function ensureSession(){const {data:{session}}=await db.auth.getSession();if(session)return session;const {data,error}=await db.auth.signInAnonymously();if(error)throw error;return data.session}
async function loginPi(){
  try{
    if(!db)await bootPromise;
    const session=await ensureSession();
    const auth=await Pi.authenticate(["username"],p=>console.warn(p));
    const res=await fetch("/api/pi-login",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({piAccessToken:auth.accessToken})});
    const text=await res.text();let out;try{out=JSON.parse(text)}catch{throw new Error(text)}
    if(!res.ok)throw new Error(out.error||"فشل تسجيل الدخول");
    profile=out.profile;renderUser();showToast("تم تسجيل الدخول");
  }catch(e){showError(e,{stage:"pi_login"})}
}
async function restoreProfile(){const {data:{session}}=await db.auth.getSession();if(!session)return;const {data}=await db.from("profiles").select("*").eq("id",session.user.id).maybeSingle();profile=data;renderUser()}
function renderUser(){const logged=!!profile;$("loginBtn").classList.toggle("hidden",logged);$("headerUser").classList.toggle("hidden",!logged);$("guestProfile").classList.toggle("hidden",logged);$("userProfile").classList.toggle("hidden",!logged);if(logged){$("userName").textContent=profile.pi_username;$("profileName").textContent=profile.pi_username}}
function renderCategories(){$("categories").innerHTML=CATS.map(([label,val,icon])=>`<button class="chip ${activeCategory===val?"active":""}" data-cat="${val}"><i class="fa-solid ${icon}"></i>${label}</button>`).join("");$("adCategory").innerHTML=CATS.slice(1).map(([l,v])=>`<option value="${v}">${l}</option>`).join("")}
async function loadAds(){
  let q=db.from("ads").select("*,profiles!ads_owner_id_fkey(pi_username)").eq("status","active");
  if(activeCategory!=="all")q=q.eq("category",activeCategory);if($("cityFilter").value)q=q.eq("city",$("cityFilter").value);if($("searchInput").value.trim())q=q.ilike("title",`%${$("searchInput").value.trim()}%`);
  const {data,error}=await q.order("created_at",{ascending:false});if(error)return showError(error,{stage:"load_ads"});ads=data||[];renderAds();
}
function firstImage(a){return (Array.isArray(a.images)&&a.images[0])||a.image_url||"https://placehold.co/600x600?text=DealWay"}
function renderAds(){const list=$("products");list.innerHTML=ads.length?ads.map(a=>`<article class="card" data-details="${a.id}"><div class="card-img-wrap"><img class="card-img" src="${esc(firstImage(a))}" loading="lazy"><div class="location"><i class="fa-solid fa-location-dot"></i> ${esc(a.city)}</div></div><div class="card-body"><div class="card-title">${esc(a.title)}</div><div class="price">${Number(a.price).toLocaleString("ar-EG")} π</div></div></article>`).join(""):`<div class="empty"><i class="fa-solid fa-box-open"></i><h3>لا توجد إعلانات</h3></div>`}
function nav(name){document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"));$("view-"+name).classList.remove("hidden");document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.nav===name));if(name==="profile"&&profile)loadMyAds();if(name==="chats"&&profile)loadInbox()}
function showDetails(id){
  selectedAd=ads.find(a=>a.id===id);if(!selectedAd)return;const imgs=(Array.isArray(selectedAd.images)&&selectedAd.images.length?selectedAd.images:[firstImage(selectedAd)]);
  $("detailSlider").innerHTML=imgs.map(src=>`<div class="slide"><img src="${esc(src)}"></div>`).join("");$("detailDots").innerHTML=imgs.map((_,i)=>`<span class="dot ${i===0?"active":""}"></span>`).join("");
  $("detailSlider").onscroll=()=>{const i=Math.round(Math.abs($("detailSlider").scrollLeft)/$("detailSlider").offsetWidth);document.querySelectorAll("#detailDots .dot").forEach((d,n)=>d.classList.toggle("active",n===i))};
  $("detailTitle").textContent=selectedAd.title;$("detailPrice").textContent=Number(selectedAd.price).toLocaleString("ar-EG")+" π";$("detailCity").innerHTML=`<i class="fa-solid fa-location-dot"></i>${esc(selectedAd.city)}`;$("detailDescription").textContent=selectedAd.description;$("sellerName").textContent=selectedAd.profiles?.pi_username||"مستخدم Pi";$("sellerAvatar").textContent=(selectedAd.profiles?.pi_username||"U")[0].toUpperCase();
  const own=profile&&selectedAd.owner_id===profile.id;$("detailActions").innerHTML=own?`<button class="btn btn-danger" style="width:100%" onclick="deleteAd('${selectedAd.id}')"><i class="fa-solid fa-trash"></i> حذف الإعلان</button>`:`<button class="btn btn-primary" style="width:100%" onclick="startConversation()"><i class="fa-solid fa-comment-dots"></i> مراسلة البائع</button>`;nav("details")
}
function openAddModal(){if(!profile)return loginPi();selectedFiles=[];renderPreviews();openModal("addModal")}
$("imageInput").addEventListener("change",e=>{const files=[...e.target.files].filter(f=>f.type.startsWith("image/"));if(selectedFiles.length+files.length>3){showToast("الحد الأقصى 3 صور","error");e.target.value="";return}selectedFiles.push(...files);renderPreviews();e.target.value=""})
function renderPreviews(){$("previews").innerHTML="";selectedFiles.forEach((file,i)=>{const url=URL.createObjectURL(file);$("previews").insertAdjacentHTML("beforeend",`<div class="preview"><img src="${url}"><button type="button" onclick="removeImage(${i})">✕</button></div>`)})}
function removeImage(i){selectedFiles.splice(i,1);renderPreviews()}
async function compressAndUpload(file,index,total){
  const compressed=await imageCompression(file,{maxSizeMB:.8,maxWidthOrHeight:1200,useWebWorker:true,fileType:"image/jpeg",initialQuality:.82});
  const path=`${profile.id}/${Date.now()}_${crypto.randomUUID()}.jpg`;
  $("uploadText").textContent=`رفع الصورة ${index+1} من ${total}`;$("uploadProgress").style.width=`${Math.round(index/total*100)}%`;
  const {error}=await db.storage.from("ad-images").upload(path,compressed,{contentType:"image/jpeg",upsert:false,cacheControl:"31536000"});if(error)throw error;
  const {data}=db.storage.from("ad-images").getPublicUrl(path);return data.publicUrl
}
$("adForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!profile)return loginPi();const btn=$("publishBtn");btn.disabled=true;$("uploadProgressWrap").classList.remove("hidden");
  const uploaded=[];try{
    for(let i=0;i<selectedFiles.length;i++)uploaded.push(await compressAndUpload(selectedFiles[i],i,selectedFiles.length));
    $("uploadProgress").style.width="100%";$("uploadText").textContent="جارٍ حفظ الإعلان...";
    const row={owner_id:profile.id,title:$("adTitle").value.trim(),description:$("adDescription").value.trim(),category:$("adCategory").value,city:$("adCity").value,price:Number($("adPrice").value),images:uploaded,image_url:uploaded[0]||null};
    const {error}=await db.from("ads").insert(row);if(error)throw error;
    e.target.reset();selectedFiles=[];renderPreviews();closeModal("addModal");showToast("تم نشر الإعلان بنجاح");await loadAds();
  }catch(err){showError(err,{stage:"upload_or_insert",selectedFiles:selectedFiles.map(f=>({name:f.name,size:f.size,type:f.type}))})}
  finally{btn.disabled=false;$("uploadProgressWrap").classList.add("hidden");$("uploadProgress").style.width="0%"}
})
async function deleteAd(id){if(!confirm("هل تريد حذف الإعلان؟"))return;const {error}=await db.from("ads").delete().eq("id",id);if(error)return showError(error,{stage:"delete_ad"});showToast("تم حذف الإعلان");await loadAds();nav("home")}
async function loadMyAds(){const {data,error}=await db.from("ads").select("*").eq("owner_id",profile.id).order("created_at",{ascending:false});if(error)return;$("statAds").textContent=data.length;$("statImages").textContent=data.reduce((n,a)=>n+(a.images?.length||0),0);$("myAds").innerHTML=data.length?data.map(a=>`<article class="card" onclick="showDetails('${a.id}')"><div class="card-img-wrap"><img class="card-img" src="${esc(firstImage(a))}"></div><div class="card-body"><div class="card-title">${esc(a.title)}</div><div class="price">${Number(a.price).toLocaleString("ar-EG")} π</div></div></article>`).join(""):`<div class="empty"><i class="fa-solid fa-folder-open"></i><h3>لا توجد إعلانات</h3></div>`}
async function startConversation(){if(!profile)return loginPi();const {data,error}=await db.rpc("get_or_create_conversation",{p_ad_id:selectedAd.id,p_seller_id:selectedAd.owner_id});if(error)return showError(error,{stage:"start_chat"});activeConversation=data;$("chatTitle").textContent=selectedAd.title;$("chatPeer").textContent=selectedAd.profiles?.pi_username||"";openModal("chatModal");await openConversation(data)}
async function loadInbox(){const {data,error}=await db.from("conversation_members").select("conversation_id,conversations(id,ads(title))").eq("user_id",profile.id);if(error)return;const rows=data||[];$("statChats").textContent=rows.length;$("inbox").innerHTML=rows.length?rows.map(r=>`<div class="chat-list-item" onclick="openConversationFromInbox('${r.conversation_id}','${esc(r.conversations.ads?.title||"محادثة")}')"><div class="avatar"><i class="fa-solid fa-comment"></i></div><div><strong>${esc(r.conversations.ads?.title||"محادثة")}</strong><div style="font-size:13px;color:var(--muted)">اضغط لفتح المحادثة</div></div></div>`).join(""):`<div class="empty"><i class="fa-solid fa-inbox"></i><h3>لا توجد محادثات</h3></div>`}
async function openConversationFromInbox(id,title){activeConversation=id;$("chatTitle").textContent=title;$("chatPeer").textContent="";openModal("chatModal");await openConversation(id)}
async function openConversation(id){const {data,error}=await db.from("messages").select("*,profiles(pi_username)").eq("conversation_id",id).order("created_at");if(error)return;renderMessages(data||[]);if(realtime)await db.removeChannel(realtime);realtime=db.channel("dealway-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`conversation_id=eq.${id}`},async p=>{const {data}=await db.from("messages").select("*,profiles(pi_username)").eq("id",p.new.id).single();appendMessage(data)}).subscribe()}
function renderMessages(rows){$("messages").innerHTML="";rows.forEach(appendMessage)}
function appendMessage(m){const d=document.createElement("div");d.className="bubble "+(m.sender_id===profile.id?"me":"");d.textContent=m.body;$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
$("sendForm").addEventListener("submit",async e=>{e.preventDefault();if(!activeConversation)return;const body=$("messageInput").value.trim();const {error}=await db.from("messages").insert({conversation_id:activeConversation,sender_id:profile.id,body});if(error)return showError(error,{stage:"send_message"});$("messageInput").value=""})
async function closeChat(){closeModal("chatModal");if(realtime){await db.removeChannel(realtime);realtime=null}}
document.addEventListener("click",e=>{const c=e.target.closest("[data-cat]"),d=e.target.closest("[data-details]");if(c){activeCategory=c.dataset.cat;renderCategories();loadAds()}if(d)showDetails(d.dataset.details);if(e.target.classList.contains("modal"))closeModal(e.target.id)})
$("loginBtn").onclick=loginPi;$("searchInput").oninput=loadAds;$("cityFilter").onchange=loadAds;
bootPromise=boot();
</script>
</body>
</html>
