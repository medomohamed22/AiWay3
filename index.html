<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>AiWay</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <strong>المحادثات</strong>
      <button class="icon-btn mobile-only" id="closeSide" aria-label="إغلاق">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>محادثة جديدة</span>
    </button>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search" id="historySearch" placeholder="بحث في المحادثات">
    </div>
    <div class="history" id="history"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="brand">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="فتح المحادثات">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="logo">AI</div>
        <div class="brand-copy"><b>AiWay</b><small>مساعد متعدد النماذج</small></div>
      </div>

      <div class="model-picker" id="modelPicker">
        <button class="model-trigger" id="modelTrigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="model-trigger-main"><span id="selectedModelIcon"></span><span id="selectedModelName"></span></span>
          <svg class="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
        </button>
        <div class="model-menu" id="modelMenu" role="listbox"></div>
      </div>

      <div class="header-actions">
        <button class="login-btn" id="loginBtn" aria-label="تسجيل الدخول بحساب Pi" title="تسجيل الدخول بحساب Pi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 11h5M18.5 8.5 21 11l-2.5 2.5"/></svg>
          <span id="loginLabel">دخول</span>
        </button>
        <button class="coins-btn" id="coinsBtn" aria-label="الرصيد" title="الرصيد">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5c.7-.7 1.6-1 2.6-1 1.3 0 2.4.6 2.4 1.7 0 2.5-5 1.2-5 3.5 0 1.1 1.1 1.8 2.6 1.8 1.1 0 2.1-.4 2.8-1.1M12 6.8v10.4"/></svg>
          <span id="coinsCount">10</span>
        </button>
      </div>
    </header>

    <section class="chat" id="chat" aria-live="polite"></section>
    <button class="jump-bottom" id="jumpBottom" aria-label="النزول لآخر المحادثة" title="النزول لآخر المحادثة">
      <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/><path d="M12 3v12"/></svg>
    </button>

    <section class="composer-area">
      <div class="preview" id="preview"></div>
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
        <div class="composer-actions">
          <div class="composer-tools">
            <button class="tool-btn" id="fileBtn" aria-label="إرفاق ملفات" title="إرفاق ملفات">
              <svg viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.5-9.5a4 4 0 0 1 5.7 5.7l-9.5 9.5a2 2 0 0 1-2.8-2.8l8.8-8.8"/></svg>
            </button>
            <button class="tool-btn" id="cameraBtn" aria-label="فتح الكاميرا" title="فتح الكاميرا">
              <svg viewBox="0 0 24 24"><path d="M14.5 5 13 3h-2L9.5 5H6a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3h-3.5Z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,text/csv" multiple hidden>
            <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
          </div>
          <button class="send" id="sendBtn"><span>إرسال</span><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        </div>
      </div>
      <div class="cost-note" id="costNote"></div>
    </section>
  </main>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="overlay" id="overlay"></div>

<section class="modal coins-modal" id="coinsModal" aria-modal="true" role="dialog">
  <div class="modal-head">
    <div><h3>رصيد الاستخدام</h3><p>رصيد تجريبي محفوظ على هذا الجهاز.</p></div>
    <button class="icon-btn closeModal" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="wallet-card">
    <span>رصيدك الحالي</span><strong><span id="modalCoins">10</span> كوين</strong>
  </div>
  <div class="wallet-card" id="piAccountCard" hidden>
    <span>حساب Pi</span><strong id="piAccountName">—</strong>
    <small id="piWalletAddress">—</small>
    <small id="piPaymentsStatus">صلاحية المدفوعات: غير مفعلة</small>
  </div>
  <h4>تكلفة المحاولة</h4>
  <div class="cost-list" id="costList"></div>
  <h4>شراء تجريبي</h4>
  <div class="packages">
    <button class="package" data-add="25"><span><b>25</b> كوين</span><strong>$2</strong></button>
    <button class="package featured" data-add="70"><span><b>70</b> كوين</span><strong>$5</strong><small>الأكثر اختيارًا</small></button>
    <button class="package" data-add="160"><span><b>160</b> كوين</span><strong>$10</strong></button>
  </div>
  <p class="demo-warning">يتم الدفع الحقيقي عبر Pi Wallet على الشبكة الرئيسية.</p>
</section>

<div id="toast" class="toast"></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
