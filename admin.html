<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b34c4">
<title>AppHub Admin</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--p:#6d44d7;--pd:#43227f;--bg:#f7f7fb;--ink:#16151d;--mut:#747180;--line:#e9e6ef;--ok:#13a36d;--bad:#d34848}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:20px;font-weight:900}.brand b{color:var(--p)}.account,.primary,.ghost,.danger{border:0;border-radius:12px;padding:10px 13px;font-weight:850}.account,.primary{background:var(--pd);color:#fff}.account{max-width:56vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ghost{background:#eeeaf5;color:#4b4654}.danger{background:#ffe7e7;color:#b72d2d}.wrap{max-width:1100px;margin:auto;padding:20px 16px}.hero{background:linear-gradient(140deg,#2f175c,#7951df);color:#fff;border-radius:22px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 8px}.hero p{margin:0;opacity:.82}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.stat,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.stat{padding:17px}.stat b{font-size:26px;display:block;margin-top:5px}.panel{padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{overflow:hidden}.cover{height:140px;background:#eee}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.head{display:flex;gap:10px;align-items:center}.logo{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#eee}.title{margin:0 0 4px;font-size:17px}.meta,.desc{color:var(--mut);font-size:12px}.desc{line-height:1.55}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;background:#f0ebff;color:var(--p);margin:2px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:38px;color:var(--mut);border:1px dashed #ccc4d7;border-radius:16px;background:#fff}.notice{padding:13px;border-radius:12px;background:#fff0d5;color:#8d5c00;margin:14px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#211b2c;color:#fff;padding:11px 15px;border-radius:12px;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%)}a.back{color:var(--p);font-weight:800;text-decoration:none}@media(max-width:760px){.topin{padding:10px 12px}.brand{font-size:18px}.account{font-size:13px;padding:8px 10px}.wrap{padding:14px 12px}.hero{padding:20px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat b{font-size:22px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><b>π</b> AppHub Admin</div><button class="account" id="accountBtn" onclick="handleAccount()">Sign in with Pi</button></div></header>
<main class="wrap">
<div class="hero"><h1>Admin dashboard</h1><p>Review submitted Pi apps and track completed submission revenue.</p></div>
<a class="back" href="/">← Back to AppHub</a>
<div id="accessNotice" class="notice">Sign in using the Pi account registered as admin in the database.</div>
<section id="dashboard" hidden>
<div class="stats"><div class="stat"><span>Total revenue</span><b id="revenue">0 Pi</b></div><div class="stat"><span>Pending apps</span><b id="pendingCount">0</b></div></div>
<div class="panel"><div class="row" style="justify-content:space-between;align-items:center;margin-top:0"><div><h2 style="margin:0">Review queue</h2><div class="meta">Approve, reject, or suspend submitted applications.</div></div><button class="ghost" onclick="loadAdmin()">Refresh</button></div></div>
<div id="adminApps" class="grid" style="margin-top:14px"></div>
</section>
</main>
<div class="toast" id="toast"></div>
<script>
const API={login:'/api/pi-login',admin:'/api/admin-apps',stats:'/api/admin-stats'};
let auth=JSON.parse(localStorage.getItem('apphub_auth')||'null');
addEventListener('DOMContentLoaded',async()=>{if(window.Pi)Pi.init({version:'2.0',sandbox:false});restore();if(isAdmin())await loadAdmin()});
function headers(){return{'Content-Type':'application/json',...(auth?.token?{Authorization:'Bearer '+auth.token}:{})}}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}
function isAdmin(){return ['admin','moderator'].includes(String(auth?.user?.role||'').toLowerCase())}
function restore(){const btn=document.getElementById('accountBtn'),notice=document.getElementById('accessNotice'),dashboard=document.getElementById('dashboard');if(auth?.user){btn.textContent='@'+auth.user.username;btn.title='Tap to sign out'}else{btn.textContent='Sign in with Pi';btn.title=''}if(isAdmin()){notice.hidden=true;dashboard.hidden=false}else{dashboard.hidden=true;notice.hidden=false;notice.textContent=auth?.user?'This Pi account is not registered as an admin. Tap your username to sign out and use the admin account.':'Sign in using the Pi account registered as admin in the database.'}}
function handleAccount(){if(auth?.token)return logout();loginWithPi()}
function logout(){auth=null;localStorage.removeItem('apphub_auth');localStorage.removeItem('apphub_pending_submission');restore();document.getElementById('adminApps').innerHTML='';toast('Signed out')}
async function loginWithPi(){if(!window.Pi)return toast('Open this page inside Pi Browser');try{const result=await Pi.authenticate(['username','payments'],payment=>console.warn('Incomplete payment',payment));const response=await fetch(API.login,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:result.accessToken})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Pi sign-in failed');auth=data;localStorage.setItem('apphub_auth',JSON.stringify(auth));restore();if(!isAdmin())return toast('This account is not an admin');toast('Admin signed in');await loadAdmin()}catch(error){console.error(error);toast(error.message||'Sign-in failed')}}
async function loadAdmin(){if(!isAdmin())return restore();try{const [appsResponse,statsResponse]=await Promise.all([fetch(API.admin,{headers:headers()}),fetch(API.stats,{headers:headers()})]);const appsData=await appsResponse.json(),statsData=await statsResponse.json();if(appsResponse.status===401||appsResponse.status===403){logout();throw new Error(appsData.error||'Admin access required')}if(!appsResponse.ok)throw new Error(appsData.error||'Unable to load apps');if(!statsResponse.ok)throw new Error(statsData.error||'Unable to load statistics');document.getElementById('revenue').textContent=Number(statsData.totalRevenuePi||0).toFixed(2)+' Pi';document.getElementById('pendingCount').textContent=statsData.pendingApps||0;const list=appsData.apps||[];document.getElementById('adminApps').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No submitted apps found.</div>'}catch(error){console.error(error);toast(error.message||'Unable to load dashboard')}}
function card(app){const cover=app.screenshot_urls?.[0]||app.icon_url||'';return `<article class="card"><div class="cover"><img src="${esc(cover)}" alt=""></div><div class="body"><div class="head"><img class="logo" src="${esc(app.icon_url||'')}" alt=""><div><h3 class="title">${esc(app.name)}</h3><span class="badge">${esc(app.category)}</span><span class="badge">${esc(app.network)}</span><span class="badge">${esc(app.status)}</span></div></div><p class="desc">${esc(app.short_description)}</p><div class="meta">Owner: @${esc(app.users?.username||'unknown')}</div><div class="row"><button class="primary" onclick="review('${app.id}','published')">Approve</button><button class="danger" onclick="review('${app.id}','rejected')">Reject</button><button class="ghost" onclick="review('${app.id}','suspended')">Suspend</button></div></div></article>`}
async function review(id,status){const adminNote=status==='rejected'?prompt('Reason for rejection',''):'';try{const response=await fetch(API.admin,{method:'PATCH',headers:headers(),body:JSON.stringify({id,status,adminNote,isFeatured:false})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to update app');toast('App status updated');await loadAdmin()}catch(error){toast(error.message||'Review failed')}}
function esc(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
</script>
</body>
</html>
